<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">一次二维互相关运算</title>
  <desc id="desc">四乘四输入，二乘二卷积核，输出三乘三。第一格计算为一乘一加二乘零加三乘零加零乘负一，结果为一。</desc>
  <rect width="840" height="360" fill="#fff" />
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#222">
    <text x="32" y="42" font-size="22" font-weight="600">一格输出，是怎样算出来的？</text>
    <text x="808" y="41" font-size="13" text-anchor="end" fill="#777">S = 1 · P = 0 · b = 0</text>
    <text x="40" y="85" font-size="15">输入 · 4 × 4</text>
    <text x="324" y="85" font-size="15">卷积核 · 2 × 2</text>
    <text x="572" y="85" font-size="15">输出 · 3 × 3</text>
  </g>
  <rect x="40" y="104" width="144" height="144" fill="#fff" stroke="#aaa" />
  <rect x="40" y="104" width="72" height="72" fill="#fff" />
  <path d="M76 104v144m36-144v144m36-144v144M40 140h144M40 176h144M40 212h144" stroke="#ccc" fill="none" />
  <rect x="40" y="104" width="72" height="72" fill="none" stroke="#333" stroke-width="1.5" />
  <g font-family="Consolas,monospace" font-size="20" text-anchor="middle" fill="#333">
    <text x="58" y="130">1</text><text x="94" y="130">2</text><text x="130" y="130">0</text><text x="166" y="130">1</text>
    <text x="58" y="166">3</text><text x="94" y="166">0</text><text x="130" y="166">1</text><text x="166" y="166">2</text>
    <text x="58" y="202">2</text><text x="94" y="202">1</text><text x="130" y="202">3</text><text x="166" y="202">0</text>
    <text x="58" y="238">0</text><text x="94" y="238">2</text><text x="130" y="238">1</text><text x="166" y="238">1</text>
  </g>
  <rect x="324" y="120" width="88" height="88" fill="#fff" stroke="#888" />
  <path d="M368 120v88M324 164h88" stroke="#ccc" />
  <g font-family="Consolas,monospace" font-size="21" text-anchor="middle" fill="#222"><text x="346" y="148">1</text><text x="390" y="148">0</text><text x="346" y="192">0</text><text x="390" y="192">−1</text></g>
  <rect x="572" y="104" width="126" height="126" fill="#fff" stroke="#aaa" />
  <path d="M614 104v126m42-126v126M572 146h126M572 188h126" stroke="#ccc" />
  <rect x="572" y="104" width="42" height="42" fill="#fff" stroke="#333" stroke-width="1.5" />
  <g font-family="Consolas,monospace" font-size="20" text-anchor="middle" fill="#333">
    <text x="593" y="132" font-weight="700">1</text><text x="635" y="132">1</text><text x="677" y="132">−2</text>
    <text x="593" y="174">2</text><text x="635" y="174">−3</text><text x="677" y="174">1</text>
    <text x="593" y="216">0</text><text x="635" y="216">0</text><text x="677" y="216">2</text>
  </g>
  <g font-family="Segoe UI,sans-serif" font-size="30" text-anchor="middle" fill="#777"><text x="253" y="180">×</text><text x="491" y="180">=</text></g>
  <rect x="32" y="278" width="776" height="44" rx="4" fill="#fff" />
  <text x="52" y="306" font-family="Consolas,monospace" font-size="18" fill="#222">1×1 + 2×0 + 3×0 + 0×(−1) = 1</text>
  <text x="32" y="346" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#777">输入窗口右移一格，继续使用同一组权重。</text>
</svg>
