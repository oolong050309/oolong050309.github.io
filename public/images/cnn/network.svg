<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">本文小型 CNN 的数据流</title>
  <desc id="desc">三乘三十二乘三十二的输入，经过两个卷积块得到三十二乘八乘八，再全局平均池化得到三十二乘一乘一，展平后通过线性层得到十个分数。</desc>
  <rect width="900" height="300" fill="#fff" />
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#222">
    <text x="32" y="42" font-size="22" font-weight="600">从像素，到 10 个分类分数</text>
    <text x="32" y="70" font-size="14" fill="#777">与示例代码一致，图中省略批次维度，特征图尺寸按 C × H × W 表示。</text>
  </g>
  <g fill="#fff" stroke="#ccc"><rect x="32" y="106" width="136" height="110" rx="5" /><rect x="207" y="106" width="136" height="110" rx="5" /><rect x="382" y="106" width="136" height="110" rx="5" /><rect x="557" y="106" width="136" height="110" rx="5" /></g>
  <rect x="732" y="106" width="136" height="110" rx="5" fill="#fff" stroke="#ccc" />
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#222"><text x="100" y="144">输入图像</text><text x="275" y="144">卷积块 × 2</text><text x="450" y="144">全局平均池化</text><text x="625" y="144">展平</text><text x="800" y="144">线性分类</text></g>
  <g font-family="Consolas,Microsoft YaHei,monospace" font-size="15" text-anchor="middle" fill="#666"><text x="100" y="183">3 × 32 × 32</text><text x="275" y="183">32 × 8 × 8</text><text x="450" y="183">32 × 1 × 1</text><text x="625" y="183">32 维</text><text x="800" y="183">10 个分数</text></g>
  <path d="M178 161h18m-5-5 5 5-5 5m162-5h18m-5-5 5 5-5 5m162-5h18m-5-5 5 5-5 5m162-5h18m-5-5 5 5-5 5" stroke="#777" fill="none" stroke-width="1.2" />
  <text x="32" y="257" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" fill="#666">每个卷积块：3 × 3 卷积 → ReLU → 2 × 2 最大池化</text>
  <text x="32" y="281" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#888">两组卷积的输出通道数依次为 16、32。</text>
</svg>
